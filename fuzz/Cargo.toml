[package]
name = "ternary-gemm-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ternary-gemm = { path = "..", default-features = false, features = ["avx2"] }

# Keep the fuzz crate out of the main package's build.
[workspace]
members = ["."]

[[bin]]
name = "tgm_parse"
path = "fuzz_targets/tgm_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pack_roundtrip"
path = "fuzz_targets/pack_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quantize_simd"
path = "fuzz_targets/quantize_simd.rs"
test = false
doc = false
bench = false
