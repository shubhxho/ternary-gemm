[package]
name = "ternary-gemm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Fused ternary (BitNet b1.58-style) kernels in Rust + CUDA: W2A8/W2A16 GEMV/GEMM for LLM decode, and a latency-first batch-1 path for small signal models"
license = "MIT"
repository = "https://github.com/shubhxho/ternary-gemm"
readme = "README.md"
keywords = ["cuda", "bitnet", "ternary", "llm", "gemv"]
categories = ["science", "hardware-support"]

[dependencies]
# dynamic-loading: no CUDA toolkit needed at build time; libcuda / libnvrtc / libcublas are dlopen'ed at runtime.
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "cuda-12080", "dynamic-loading", "driver", "nvrtc", "cublas", "f16"] }
half = "2"
rand = "0.9"

[features]
default = ["cuda"]
# GPU backend: NVRTC-compiled kernels via cudarc (dlopen'ed at runtime, no toolkit needed to build).
# Without it the crate is CPU-only: packing, reference, signal-model CPU engine.
cuda = ["dep:cudarc"]

[[bin]]
name = "bench"
required-features = ["cuda"]

[[bin]]
name = "compile_check"
required-features = ["cuda"]

[[bin]]
name = "latency"
required-features = ["cuda"]

[[example]]
name = "signal_model"
required-features = ["cuda"]

[[test]]
name = "gpu"
required-features = ["cuda"]

[profile.release]
debug = 1
