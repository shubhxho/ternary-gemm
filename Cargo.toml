[package]
name = "ternary-gemm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Fused ternary (BitNet b1.58-style) kernels in Rust + CUDA: W2A8/W2A16 GEMV/GEMM for LLM decode, and a latency-first batch-1 path for small signal models"
license = "MIT"
repository = "https://github.com/shubhxho/ternary-gemm"
readme = "README.md"
keywords = ["cuda", "bitnet", "ternary", "llm", "gemv"]
categories = ["science", "hardware-support"]

[dependencies]
# dynamic-loading: no CUDA toolkit needed at build time; libcuda / libnvrtc / libcublas are dlopen'ed at runtime.
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "cuda-12080", "dynamic-loading", "driver", "nvrtc", "cublas", "f16"] }
half = "2"
safetensors = { version = "0.6", optional = true }
rand = "0.9"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "cpu"
harness = false

[features]
default = ["cuda", "avx2"]
# GPU backend: NVRTC-compiled kernels via cudarc (dlopen'ed at runtime, no toolkit needed to build).
# Without it the crate is CPU-only: packing, reference, signal-model CPU engine.
cuda = ["dep:cudarc"]
# x86_64 SIMD fast paths for the CPU engines (SSE4.1 quantize, AVX2 int8/f32 dots), selected at
# runtime with CPU feature detection. Disable to force the portable code (e.g. to debug).
avx2 = []
# AVX-512 VNNI (vpdpbusd) path for CpuEngine, runtime-detected. Needs rustc >= 1.89 (stable
# AVX-512 intrinsics), so it is opt-in above the 1.88 MSRV.
avx512 = ["avx2"]
# safetensors -> .tgm converter (src/convert.rs, `convert` binary).
convert = ["dep:safetensors"]

[[bin]]
name = "bench"
required-features = ["cuda"]

[[bin]]
name = "compile_check"
required-features = ["cuda"]

[[bin]]
name = "convert"
required-features = ["convert"]

[[bin]]
name = "latency"
required-features = ["cuda"]

[[example]]
name = "signal_model"
required-features = ["cuda"]

[[test]]
name = "gpu"
required-features = ["cuda"]

[[test]]
name = "convert"
required-features = ["convert"]

[profile.release]
debug = 1

[[test]]
name = "looped_gpu"
required-features = ["cuda"]

[[bin]]
name = "autotune"
required-features = ["cuda"]

[[test]]
name = "nvrtc_sm120"
required-features = ["cuda"]
