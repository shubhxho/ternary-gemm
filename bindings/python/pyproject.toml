[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "ternary-gemm"
version = "0.1.0"
description = "Ternary (BitNet b1.58) W2A8 GEMM, signal models and a looped transformer: CPU bindings"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
test = ["pytest>=7"]
torch = ["torch>=2.4"]

[tool.maturin]
python-source = "python"
module-name = "ternary_gemm._ternary_gemm"
features = ["pyo3/extension-module"]
