# Lint config for the helper scripts in scripts/ (and the Python binding).
line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
  "E402",  # matplotlib.use("Agg") must run before pyplot is imported
  "E501",  # long string literals (labels); code lines are handled by `ruff format`
]
