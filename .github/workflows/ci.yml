name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --features avx512 -- -D warnings
      - run: cargo clippy --all-targets --features convert -- -D warnings
      - run: cargo clippy --all-targets --features nvml -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No GPU on hosted runners: GPU tests print SKIPPED and pass; CPU reference,
      # kernel emulation and signal-model tests run for real.
      - run: cargo test --release --all-targets
      - name: Converter (feature convert)
        run: cargo test --release --features convert --test convert
      - name: AVX-512 VNNI path (runtime-detected; exercised only on runners that have it)
        run: cargo test --release --features avx512 --test mlp -- --nocapture
      - name: CPU-only build with SIMD (no cuda feature)
        run: cargo test --release --no-default-features --features avx2
      - name: CPU-only, portable code paths (no SIMD feature)
        run: cargo test --release --no-default-features

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --lib

  nvrtc:
    name: NVRTC + ptxas compile check (sm_80..sm_120)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # NVRTC and ptxas from NVIDIA's pip wheels: no CUDA toolkit or GPU needed.
      - name: Install NVRTC 12.8 + ptxas
        run: |
          python -m pip install --quiet "nvidia-cuda-nvrtc-cu12==12.8.*" "nvidia-cuda-nvcc-cu12==12.8.*"
          NV=$(python -c "import nvidia; print(list(nvidia.__path__)[0])")
          echo "LD_LIBRARY_PATH=$NV/cuda_nvrtc/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "PTXAS=$NV/cuda_nvcc/bin/ptxas" >> "$GITHUB_ENV"
      - run: cargo run --release --bin compile_check -- compute_80 compute_86 compute_89 compute_90 compute_120 compute_120a
      - name: sm_120 kernel set + register table vs ptxas
        run: TERNARY_REQUIRE_NVRTC=1 cargo test --release --test nvrtc_sm120

  deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  python-lint:
    name: ruff (scripts, Python bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: astral-sh/ruff-action@v3
        with:
          args: check scripts bindings/python langs
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check scripts bindings/python langs

  fuzz:
    name: fuzz smoke (nightly, 30 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Run each target
        working-directory: fuzz
        run: |
          for t in tgm_parse pack_roundtrip quantize_simd; do
            cargo fuzz run "$t" -- -max_total_time=30
          done

  hardware:
    name: FPGA skeleton (Icarus, Verilator, HLS C++ testbench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install simulators
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - run: make -C hw all

  python-bindings:
    name: Python bindings (maturin build + pytest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: python -m pip install "./bindings/python[test]"
      - name: pytest
        working-directory: bindings/python/tests
        run: python -m pytest -q

  package:
    name: cargo package (crate tarball builds standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked
      - name: No submodule / hardware / bindings files in the tarball
        run: |
          ! cargo package --list --locked | grep -E '^(third_party|hw|bindings|fuzz|results)/'
